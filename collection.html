<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Collection</title>
  <meta name="theme-color" content="#FF4B12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #F3F4F6; --card: #FFF; --ink: #0E1116; --muted: #6E7681; --faint: #9AA1AC; --line: #E7E9ED; --accent: #FF4B12; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { padding: 16px; background: var(--bg); font-family: Inter, sans-serif; }
    .header { display: flex; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
    .view-btn { flex: 1; background: var(--card); border: 1px solid var(--line); padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 12px; }
    .card h4 { margin: 0 0 8px; font-size: 14px; }
    .card p { margin: 4px 0; font-size: 12px; color: var(--muted); }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .tabs { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; display: flex; background: var(--card); border-top: 1px solid var(--line); }
    .tab { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 600; font-size: 12px; }
    .tab.active { color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <button class="view-btn active" onclick="setView('grid')">Grid</button>
    <button class="view-btn" onclick="setView('map')">Map</button>
  </div>
  <div id="content"></div>

  <div class="tabs">
    <div class="tab active" onclick="location.href='/home-map.html'">Map</div>
    <div class="tab" onclick="location.href='/collection.html'">Collection</div>
    <div class="tab" onclick="location.href='/boards.html'">Boards</div>
    <div class="tab" onclick="location.href='/profile.html'">Profile</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/constants.js"></script>
  <script src="lib/utils.js"></script>
  <script src="lib/auth.js"></script>
  <script>
    let currentView = 'grid';
    function setView(v) { currentView = v; render(); }

    (async () => {
      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (!user) { location.href = '/section-2-auth.html'; return; }

      const { data: runs } = await window.supabaseClient
        .from('runs').select('segment_id,seconds,run_date,segments(name,length_m)')
        .eq('user_id', user.id).order('run_date', { ascending: false });

      const byId = {};
      (runs || []).forEach(r => {
        if (!byId[r.segment_id] || r.seconds < byId[r.segment_id].seconds) byId[r.segment_id] = r;
      });
      const claimed = Object.values(byId);

      function render() {
        const content = document.getElementById('content');
        if (claimed.length === 0) {
          content.innerHTML = '<div class="empty">Run today\'s segment to claim your first</div>';
          return;
        }

        if (currentView === 'grid') {
          let html = '<div class="grid">';
          claimed.forEach(c => {
            html += '<div class="card" style="cursor:pointer;" onclick="location.href=\'/segment-sheet.html?segment_id=' + c.segment_id + '\'" ><h4>' + c.segments.name + '</h4><p>' + window.AppUtils.mmss(c.seconds) + '</p><p>' + new Date(c.run_date).toLocaleDateString() + '</p></div>';
          });
          html += '</div>';
          content.innerHTML = html;
        } else {
          content.innerHTML = '<div class="empty">Showing ' + claimed.length + ' claimed segments in your area</div>';
        }
      }

      render();
    })();
  </script>
</body>
</html>

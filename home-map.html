<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Trailblazer</title>
  <meta name="theme-color" content="#FF4B12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="/lib/mobile.css">
  <style>
    :root {
      --bg: #F3F4F6;
      --card: #FFF;
      --ink: #0E1116;
      --muted: #6E7681;
      --faint: #9AA1AC;
      --line: #E7E9ED;
      --accent: #FF4B12;
      --sh: 0 1px 2px rgba(14,17,22,.05), 0 10px 28px -18px rgba(14,17,22,.35);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    #map {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 56px;
      z-index: 1;
    }
    .mapbox-canvas-container.mapboxgl-canvas-container {
      height: 100%;
    }
    /* Top bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 5;
      pointer-events: none;
    }
    .area-btn {
      pointer-events: all;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--sh);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .locate-btn {
      pointer-events: all;
      margin-left: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      width: 36px;
      height: 36px;
      padding: 0;
      cursor: pointer;
      box-shadow: var(--sh);
      display: grid;
      place-items: center;
      flex: none;
    }
    .locate-btn svg {
      width: 18px;
      height: 18px;
    }
    /* Card strip */
    .card-strip {
      position: fixed;
      bottom: 56px;
      left: 0;
      right: 0;
      height: 120px;
      display: flex;
      gap: 8px;
      padding: 0 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      z-index: 4;
    }
    .card-strip::-webkit-scrollbar {
      height: 4px;
    }
    .card-strip::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 2px;
    }
    .segment-card {
      flex: 0 0 140px;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--sh);
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .segment-card:active {
      transform: scale(0.96);
    }
    .segment-card h4 {
      margin: 0;
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .segment-card .distance {
      font-size: 11px;
      color: var(--muted);
    }
    .segment-card .runners {
      font-size: 11px;
      color: var(--faint);
      margin-top: auto;
    }
    /* Tabs */
    .tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      display: flex;
      border-top: 1px solid var(--line);
      background: var(--card);
      z-index: 5;
    }
    .tab {
      flex: 1;
      background: none;
      border: 0;
      padding: 9px 0 12px;
      cursor: pointer;
      color: var(--faint);
      font-family: inherit;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: color 0.2s;
    }
    .tab svg {
      width: 20px;
      height: 20px;
    }
    .tab[aria-selected="true"] {
      color: var(--ink);
    }
    /* Loading bar */
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--accent);
      z-index: 6;
      animation: loading 2s ease-in-out infinite;
    }
    @keyframes loading {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 100%; }
    }
    .loading-bar.done {
      animation: none;
      width: 100%;
      opacity: 0;
      transition: opacity 0.3s;
    }
    /* Pin states: featured (larger), open (outlined), collected (filled+tick) */
    .seg-pin {
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .seg-pin:active {
      transform: scale(0.9);
    }
    .seg-pin .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      border-radius: 50%;
      border: 2.5px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    /* Featured: larger, filled, ring */
    .seg-pin.featured {
      width: 40px;
      height: 40px;
    }
    .seg-pin.featured .dot {
      width: 22px;
      height: 22px;
      background: #FF4B12;
      box-shadow: 0 0 0 6px rgba(255,75,18,.2), 0 2px 6px rgba(0,0,0,.3);
    }
    /* Open: outlined */
    .seg-pin.open {
      width: 28px;
      height: 28px;
    }
    .seg-pin.open .dot {
      width: 16px;
      height: 16px;
      background: transparent;
      border: 2.5px solid #FF4B12;
    }
    /* Collected: filled with tick */
    .seg-pin.collected {
      width: 28px;
      height: 28px;
    }
    .seg-pin.collected .dot {
      width: 16px;
      height: 16px;
      background: #FF4B12;
    }
    .seg-pin.collected .tick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 12px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: translate(-50%, -55%) rotate(45deg);
    }
    .seg-pin .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #0E1116;
      color: #fff;
      font: 700 10px/1 Inter, sans-serif;
      padding: 2px 4px;
      border-radius: 9px;
      min-width: 18px;
      text-align: center;
    }
    /* Cluster */
    .seg-cluster {
      position: relative;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
    .seg-cluster .badge {
      width: 100%;
      height: 100%;
      background: #FF4B12;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    /* Featured segment card */
    .featured-container {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      padding: 12px 12px 8px;
      z-index: 4;
      pointer-events: none;
    }
    .featured-card {
      pointer-events: all;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--sh);
      border: 2px solid var(--accent);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .featured-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin: 0;
    }
    .featured-name {
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 16px;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
    }
    .featured-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .featured-detail-item {
      font-size: 11px;
      color: var(--muted);
    }
    .featured-detail-item .label {
      color: var(--faint);
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .featured-detail-item .value {
      font-family: "Inter Tight";
      font-weight: 600;
      font-size: 12px;
      color: var(--ink);
      margin-top: 2px;
    }
    .featured-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 14px;
      padding: 10px;
      cursor: pointer;
      margin-top: 4px;
      transition: transform 0.1s;
    }
    .featured-btn:active {
      transform: scale(0.96);
    }
    /* Search */
    .search-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(14, 17, 22, 0.3);
      z-index: 10;
      pointer-events: none;
    }
    .search-overlay.active {
      display: block;
      pointer-events: all;
    }
    .search-container {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: none;
      flex-direction: column;
      z-index: 11;
      gap: 8px;
    }
    .search-container.active {
      display: flex;
    }
    .search-field {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: Inter, sans-serif;
      font-size: 14px;
      color: var(--ink);
      box-shadow: var(--sh);
    }
    .search-field::placeholder {
      color: var(--faint);
    }
    .search-results {
      background: var(--card);
      border-radius: 12px;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: var(--sh);
      max-width: 100%;
    }
    .search-result-item {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s;
    }
    .search-result-item:last-child {
      border-bottom: none;
    }
    .search-result-item:hover {
      background: var(--bg);
    }
    .search-result-item.segment {
      font-weight: 600;
      color: var(--ink);
    }
    .search-result-item.place {
      color: var(--muted);
      font-size: 12px;
    }
    .search-result-empty {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .search-toggle-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0;
      cursor: pointer;
      box-shadow: var(--sh);
      display: grid;
      place-items: center;
      z-index: 11;
    }
    .search-toggle-btn svg {
      width: 18px;
      height: 18px;
    }
    .search-toggle-btn.hide {
      display: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div id="map"></div>

    <div class="loading-bar" id="loadingBar"></div>

    <div class="topbar">
      <button class="search-toggle-btn" id="searchToggleBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
      <button class="area-btn" id="areaBtn">London</button>
      <button class="locate-btn" id="locateBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94-2A11.04 11.04 0 0012 1c-6.5 0-12 5.5-12 12s5.5 12 12 12 12-5.5 12-12c0-2.26-.71-4.35-1.93-6.06zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
        </svg>
      </button>
    </div>

    <div class="search-overlay" id="searchOverlay"></div>
    <div class="search-container" id="searchContainer">
      <input type="text" class="search-field" id="searchField" placeholder="Search segments or places...">
      <div class="search-results" id="searchResults" style="display: none;">
        <div class="search-result-empty">Start typing to search</div>
      </div>
    </div>

    <div class="featured-container" id="featuredContainer"></div>

    <button id="searchAreaBtn" style="position:fixed;bottom:180px;left:12px;right:12px;background:#FF4B12;color:#fff;border:0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer;z-index:3;display:none;">Search this area</button>

    <div class="card-strip" id="cardStrip"></div>

    <div class="tabs">
      <button class="tab" data-tab="map" aria-selected="true" id="tabMap">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.5 3c-.26 0-.5.04-.74.1-.35-.85-1.18-1.46-2.18-1.46-1.3 0-2.3 1-2.22 2.48h-.02C11.89 2.1 9.69 1 7 1 3.13 1 0 4.13 0 8v12c0 .04.02.08.02.12C.14 20.74 1.7 22 3.5 22c1.3 0 2.4-.84 2.82-2h.02c2.11 1.5 4.31 2 7.16 2 3.87 0 7-3.13 7-7V5c0-.86.13-1.69.36-2.49.21-.15.43-.29.64-.42.05 0 .09.02.14.02 1.3 0 2.3-1 2.22-2.48C22.5 3.5 21.5 3 20.5 3z"/>
        </svg>
        Map
      </button>
      <button class="tab" data-tab="collection" id="tabCollection">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 21h14V5H5v16zm0-18h14c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2z"/>
        </svg>
        Collection
      </button>
      <button class="tab" data-tab="boards" id="tabBoards">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm1 11v-5h-2v5h2zM8 11c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm1 11v-5H7v5h2z"/>
        </svg>
        Boards
      </button>
      <button class="tab" data-tab="you" id="tabYou">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        You
      </button>
    </div>
  </div>

  <script src="/lib/tap.js"></script>
  <script src="/lib/errors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
  <script src="lib/constants.js"></script>
  <script src="lib/utils.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/harvest.js"></script>
  <script src="lib/featured.js"></script>
  <script src="lib/search.js"></script>
  <script>
    /* ---------- 1. BIND EVERYTHING FIRST. NO AWAIT ABOVE THIS BLOCK ---------- */
    document.getElementById('areaBtn').addEventListener('click',
      () => location.href = '/area-setup.html');
    document.getElementById('tabCollection').addEventListener('click',
      () => location.href = '/collection.html');
    document.getElementById('tabBoards').addEventListener('click',
      () => location.href = '/boards.html');
    document.getElementById('tabYou').addEventListener('click',
      () => location.href = '/profile.html');
    document.getElementById('tabMap').addEventListener('click', () => {});

    let map = null, markers = [], profile = null, allSegments = [];

    document.getElementById('locateBtn').addEventListener('click', () => {
      if (map && profile) map.flyTo({ center: [profile.home_lng, profile.home_lat], zoom: 15 });
    });

    /* Search functionality */
    const searchToggleBtn = document.getElementById('searchToggleBtn');
    const searchContainer = document.getElementById('searchContainer');
    const searchOverlay = document.getElementById('searchOverlay');
    const searchField = document.getElementById('searchField');
    const searchResults = document.getElementById('searchResults');
    let searchTimeout;

    searchToggleBtn.addEventListener('click', () => {
      searchContainer.classList.toggle('active');
      searchOverlay.classList.toggle('active');
      if (searchContainer.classList.contains('active')) {
        searchToggleBtn.classList.add('hide');
        searchField.focus();
      } else {
        searchToggleBtn.classList.remove('hide');
        searchField.value = '';
        searchResults.style.display = 'none';
      }
    });

    searchOverlay.addEventListener('click', () => {
      searchContainer.classList.remove('active');
      searchOverlay.classList.remove('active');
      searchToggleBtn.classList.remove('hide');
      searchField.value = '';
      searchResults.style.display = 'none';
    });

    searchField.addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      clearTimeout(searchTimeout);

      if (query.length < 1) {
        searchResults.style.display = 'none';
        return;
      }

      searchTimeout = setTimeout(async () => {
        const results = await window.AppSearch.combinedSearch(
          allSegments,
          query,
          { proximity: map ? [map.getCenter().lng, map.getCenter().lat] : null, limit: 10 }
        );

        let html = '';
        if (results.segments.length === 0 && results.places.length === 0) {
          html = '<div class="search-result-empty">No results found</div>';
        } else {
          results.segments.forEach(seg => {
            html += `
              <div class="search-result-item segment" data-segment-id="${seg.id}">
                ${seg.name}
                <div style="font-size: 11px; color: var(--muted); font-weight: normal;">
                  ${(seg.length_m / 1000).toFixed(1)} km
                </div>
              </div>
            `;
          });
          results.places.forEach(place => {
            html += `
              <div class="search-result-item place" data-lat="${place.lat}" data-lng="${place.lng}">
                ${place.name}
              </div>
            `;
          });
        }

        searchResults.innerHTML = html;
        searchResults.style.display = 'block';

        // Add event listeners to results
        document.querySelectorAll('.search-result-item.segment').forEach(item => {
          item.addEventListener('click', () => {
            const segId = item.dataset.segmentId;
            const seg = allSegments.find(s => s.id === parseInt(segId));
            if (seg) {
              openSheet(seg);
              searchContainer.classList.remove('active');
              searchOverlay.classList.remove('active');
              searchToggleBtn.classList.remove('hide');
              searchField.value = '';
              searchResults.style.display = 'none';
            }
          });
        });

        document.querySelectorAll('.search-result-item.place').forEach(item => {
          item.addEventListener('click', () => {
            const lat = parseFloat(item.dataset.lat);
            const lng = parseFloat(item.dataset.lng);
            if (map) {
              map.flyTo({ center: [lng, lat], zoom: 15 });
              searchContainer.classList.remove('active');
              searchOverlay.classList.remove('active');
              searchToggleBtn.classList.remove('hide');
              searchField.value = '';
              searchResults.style.display = 'none';
            }
          });
        });
      }, 300);
    });

    /* ---------- 2. THEN load data and create the map ---------- */
    (async () => {
      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (!user) { location.href = '/section-2-auth.html'; return; }

      const { data, error } = await window.supabaseClient
        .from('profiles').select('*').eq('id', user.id).single();
      if (error || !data) { showError('Could not load your profile: ' + (error && error.message)); return; }
      profile = data;

      if (profile.home_lat == null) { location.href = '/area-setup.html'; return; }

      document.getElementById('areaBtn').textContent = profile.home_label || 'Your area';

      loadFeaturedSegment();

      mapboxgl.accessToken = window.AppConstants.MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        center: [profile.home_lng, profile.home_lat],
        zoom: 14
      });

      // Load featured segment after profile is ready
      loadFeaturedSegment();

      map.on('error', e => console.error('MAPBOX ERROR:', e && e.error));
      map.on('load', () => { map.resize(); loadSegmentsInView(); });
      map.on('moveend', loadSegmentsInView);

      // Fallback timeout at 2500ms if load/moveend don't fire
      const loadTimeout = setTimeout(loadSegmentsInView, 2500);
      map.on('load', () => clearTimeout(loadTimeout));
      map.on('moveend', () => clearTimeout(loadTimeout));
    })();

    function resizeMap() {
      if (!map) return;
      requestAnimationFrame(() => {
        map.resize();
        map.triggerRepaint();
      });
    }

    window.addEventListener('orientationchange', resizeMap);
    window.addEventListener('resize', resizeMap);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeMap);
    }

    /* ---------- 3. segments ---------- */
    let loading = false;

    function computeCell(lat, lng) {
      return Math.floor(lat * 100) / 100 + ',' + Math.floor(lng * 100) / 100;
    }

    async function loadSegmentsInView() {
      // Guard with in-flight flag
      if (!map || loading) return;
      if (!map.isLoaded()) return;
      loading = true;
      const bar = document.getElementById('loadingBar');
      bar.style.display = 'block';
      try {
        const b = map.getBounds();
        // Load segments in viewport, capped at 200
        const { data, error } = await window.supabaseClient
          .from('segments').select('*')
          .gte('centre_lat', b.getSouth()).lte('centre_lat', b.getNorth())
          .gte('centre_lng', b.getWest()).lte('centre_lng', b.getEast())
          .limit(200);
        if (error) throw new Error('Segments: ' + error.message);

        // Store segments for search
        allSegments = data || [];

        const today = new Date().toISOString().slice(0, 10);
        const { data: runs, error: runsError } = await window.supabaseClient
          .from('runs').select('segment_id').eq('run_date', today);
        if (runsError) throw new Error('Today\'s runs: ' + runsError.message);
        const counts = {};
        (runs || []).forEach(r => counts[r.segment_id] = (counts[r.segment_id] || 0) + 1);

        // Get user's collected segments
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        const { data: userRuns, error: userRunsError } = await window.supabaseClient
          .from('runs').select('segment_id').eq('user_id', user.id);
        const collected = new Set(userRuns ? userRuns.map(r => r.segment_id) : []);

        // Get featured segment info
        const featuredCell = computeCell(profile.home_lat, profile.home_lng);
        const { data: allSegsInCell, error: allSegsError } = await window.supabaseClient
          .from('segments').select('id')
          .eq('cell', featuredCell)
          .limit(1);
        const featuredId = (allSegsInCell && allSegsInCell.length > 0) ? allSegsInCell[0].id : null;

        markers.forEach(m => m.remove());
        markers = [];

        // Cluster pins if more than 50
        if (data && data.length > 50) {
          createClusters(data, counts, collected, featuredId);
        } else {
          renderPins(data || [], counts, collected, featuredId);
        }

        document.getElementById('searchAreaBtn').style.display =
          (data && data.length >= 5) ? 'none' : 'block';
        updateCardStrip(data || [], counts);
      } catch (e) {
        showError('Could not load segments: ' + e.message);
      } finally {
        loading = false;
        setTimeout(() => { bar.style.display = 'none'; }, 300);
      }
    }

    function renderPins(segments, counts, collected, featuredId) {
      segments.forEach(s => {
        const el = document.createElement('div');

        // Determine pin state: featured, collected, or open
        let state = 'open';
        if (s.id === featuredId) {
          state = 'featured';
          el.className = 'seg-pin featured';
        } else if (collected.has(s.id)) {
          state = 'collected';
          el.className = 'seg-pin collected';
        } else {
          el.className = 'seg-pin open';
        }

        // Build pin HTML based on state
        let html = '<span class="dot"></span>';
        if (state === 'collected') {
          html += '<span class="tick"></span>';
        }
        const n = counts[s.id] || 0;
        if (n > 0) {
          html += '<span class="badge">' + n + '</span>';
        }
        el.innerHTML = html;

        el.addEventListener('click', () => openSheet(s));
        markers.push(new mapboxgl.Marker(el)
          .setLngLat([s.centre_lng, s.centre_lat]).addTo(map));
      });
    }

    function createClusters(segments, counts, collected, featuredId) {
      // Group segments by grid cell for clustering
      const clusters = new Map();

      segments.forEach(s => {
        const cellKey = Math.floor(s.centre_lat * 100) + ',' + Math.floor(s.centre_lng * 100);
        if (!clusters.has(cellKey)) {
          clusters.set(cellKey, []);
        }
        clusters.get(cellKey).push(s);
      });

      // Render clusters and individual pins
      clusters.forEach((segsInCluster) => {
        if (segsInCluster.length > 1) {
          // Create cluster marker
          const el = document.createElement('div');
          el.className = 'seg-cluster';
          el.innerHTML = '<div class="badge">' + segsInCluster.length + '</div>';

          const avgLat = segsInCluster.reduce((sum, s) => sum + s.centre_lat, 0) / segsInCluster.length;
          const avgLng = segsInCluster.reduce((sum, s) => sum + s.centre_lng, 0) / segsInCluster.length;

          el.addEventListener('click', () => {
            // Zoom to cluster bounds
            const bounds = new mapboxgl.LngLatBounds();
            segsInCluster.forEach(s => bounds.extend([s.centre_lng, s.centre_lat]));
            map.fitBounds(bounds, { padding: 40 });
          });

          markers.push(new mapboxgl.Marker(el)
            .setLngLat([avgLng, avgLat]).addTo(map));
        } else {
          // Single pin in this cell
          const s = segsInCluster[0];
          const el = document.createElement('div');

          let state = 'open';
          if (s.id === featuredId) {
            state = 'featured';
            el.className = 'seg-pin featured';
          } else if (collected.has(s.id)) {
            state = 'collected';
            el.className = 'seg-pin collected';
          } else {
            el.className = 'seg-pin open';
          }

          let html = '<span class="dot"></span>';
          if (state === 'collected') {
            html += '<span class="tick"></span>';
          }
          const n = counts[s.id] || 0;
          if (n > 0) {
            html += '<span class="badge">' + n + '</span>';
          }
          el.innerHTML = html;

          el.addEventListener('click', () => openSheet(s));
          markers.push(new mapboxgl.Marker(el)
            .setLngLat([s.centre_lng, s.centre_lat]).addTo(map));
        }
      });
    }

    function openSheet(s) {
      window.location.href = '/segment-sheet.html?segment_id=' + s.id;
    }

    function updateCardStrip(segs, counts) {
      const strip = document.getElementById('cardStrip');
      strip.innerHTML = segs.map(s => `
        <div class="segment-card" data-segment-id="${s.id}">
          <h4>${s.name}</h4>
          <div class="distance">${(s.length_m / 1000).toFixed(1)}km</div>
          <div class="runners">${counts[s.id] || 0} runs today</div>
        </div>
      `).join('');

      strip.querySelectorAll('.segment-card').forEach(card => {
        card.addEventListener('click', () => {
          window.location.href = '/segment-sheet.html?segment_id=' + card.dataset.segmentId;
        });
      });

      // Add swipe pan support to card strip
      let startX = 0;
      strip.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
      strip.addEventListener('touchend', (e) => {
        const endX = e.changedTouches[0].clientX;
        const diff = endX - startX;
        if (Math.abs(diff) > 10) {
          strip.scrollLeft -= diff; // Swipe right = pan left
        }
      });
    }

    document.getElementById('searchAreaBtn').addEventListener('click', async () => {
      const btn = document.getElementById('searchAreaBtn');
      btn.disabled = true;
      const c = map.getCenter();
      try {
        const res = await window.AppHarvest.harvestArea(
          c.lat, c.lng, 1500, msg => btn.textContent = msg);
        btn.textContent = `Added ${res.inserted} segments`;
        await loadSegmentsInView();
      } catch (e) {
        btn.textContent = 'Search failed';
        showError(e.message);
      } finally {
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Search this area'; }, 2500);
      }
    });

    function computeCell(lat, lng) {
      return Math.floor(lat * 100) / 100 + ',' + Math.floor(lng * 100) / 100;
    }

    async function loadFeaturedSegment() {
      if (!profile) return;
      try {
        const cell = computeCell(profile.home_lat, profile.home_lng);
        // Get all segments in this cell
        const { data: allSegs, error } = await window.supabaseClient
          .from('segments').select('*')
          .eq('cell', cell);
        if (error) {
          showError('Featured segment failed: ' + error.message);
          return;
        }
        if (!allSegs || allSegs.length === 0) {
          document.getElementById('featuredContainer').innerHTML = '<div style="padding:12px;color:#6E7681;">No segments in your area. Search to find some.</div>';
          return;
        }

        // Get today's run counts to rank by quality (runners today)
        const today = new Date().toISOString().slice(0, 10);
        const { data: todaysRuns, error: runsErr } = await window.supabaseClient
          .from('runs').select('segment_id')
          .eq('run_date', today);
        if (runsErr) {
          showError('Today\'s runs: ' + runsErr.message);
          return;
        }
        const runCounts = {};
        (todaysRuns || []).forEach(r => {
          runCounts[r.segment_id] = (runCounts[r.segment_id] || 0) + 1;
        });

        // Sort by quality (runners today, descending) for deterministic pick
        const ranked = allSegs.sort((a, b) => (runCounts[b.id] || 0) - (runCounts[a.id] || 0));
        const featured = window.AppFeatured.pickForCell(cell, ranked);
        if (!featured) return;

        // Get user's best time on this segment (all time, not just today)
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        const { data: userRuns, error: userRunsErr } = await window.supabaseClient
          .from('runs').select('seconds')
          .eq('segment_id', featured.id)
          .eq('user_id', user.id)
          .order('seconds', { ascending: true });
        if (userRunsErr) console.error('User runs error:', userRunsErr);
        const userBest = (userRuns && userRuns.length > 0) ? userRuns[0].seconds : null;

        // Get runners today for this segment
        const runnersToday = runCounts[featured.id] || 0;

        // Calculate target time for user's level
        const targetSeconds = window.AppFeatured.targetTime(featured.length_m, profile.level) * 60;
        const targetFormatted = window.AppFeatured.formatTime(targetSeconds);

        const container = document.getElementById('featuredContainer');

        // Build HTML with all required fields
        let html = `
          <div class="featured-card">
            <p class="featured-label">Featured Today</p>
            <h3 class="featured-name">${featured.name}</h3>
            <div class="featured-details">
              <div class="featured-detail-item">
                <div class="label">Distance</div>
                <div class="value">${(featured.length_m / 1000).toFixed(2)} km</div>
              </div>
        `;

        // Only show climb if it exists
        if (featured.climb_m) {
          html += `
              <div class="featured-detail-item">
                <div class="label">Climb</div>
                <div class="value">↑ ${featured.climb_m} m</div>
              </div>
          `;
        }

        html += `
              <div class="featured-detail-item">
                <div class="label">Surface</div>
                <div class="value">${featured.surface || '—'}</div>
              </div>
              <div class="featured-detail-item">
                <div class="label">Target</div>
                <div class="value">${targetFormatted}</div>
              </div>
        `;

        // Only show runners if > 0
        if (runnersToday > 0) {
          html += `
              <div class="featured-detail-item">
                <div class="label">Runners</div>
                <div class="value">${runnersToday}</div>
              </div>
          `;
        }

        // Only show user best if exists
        if (userBest) {
          html += `
              <div class="featured-detail-item">
                <div class="label">Your Best</div>
                <div class="value">${window.AppFeatured.formatTime(userBest)}</div>
              </div>
          `;
        }

        html += `
            </div>
            <button class="featured-btn" id="featuredRunBtn">Run this</button>
          </div>
        `;

        container.innerHTML = html;
        document.getElementById('featuredRunBtn').addEventListener('click', () => {
          location.href = '/recording.html?segment_id=' + featured.id;
        });
      } catch (e) {
        showError('Featured segment error: ' + (e.message || e));
      }
    }

    function showError(msg) {
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;top:50px;left:16px;right:16px;background:#FFF1EC;border:1px solid #FFD9CB;color:#8C2C0E;padding:12px;border-radius:10px;font-size:13px;z-index:10;';
      box.textContent = msg;
      document.body.appendChild(box);
      setTimeout(() => box.remove(), 5000);
    }
  </script>
</body>
</html>

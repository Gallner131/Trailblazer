<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trailblazer</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/constants.js"></script>

  <script>
    // Router: check session and redirect
    (async () => {
      const supabaseClient = window.supabase.createClient(
        window.AppConstants.SUPABASE_URL,
        window.AppConstants.SUPABASE_ANON_KEY
      );

      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        // Not signed in
        window.location.href = '/section-2-auth.html';
        return;
      }

      // Signed in - check profile
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('home_lat')
        .eq('id', user.id)
        .single();

      if (profile && profile.home_lat) {
        // Has home area
        window.location.href = '/home-map.html';
      } else {
        // No home area yet
        window.location.href = '/area-setup.html';
      }
    })();
  </script>
</body>
</html>

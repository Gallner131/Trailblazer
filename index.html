<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trailblazer</title>
<meta name="theme-color" content="#FF4B12">
<meta name="description" content="A new running challenge every day, right near you.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trailblazer">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23FF4B12' width='180' height='180'/><path d='M45 90l45-35 45 35' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='90' cy='80' r='6' fill='%23fff'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23FF4B12' width='192' height='192'/><path d='M48 96l48-36 48 36' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='96' cy='84' r='6' fill='%23fff'/></svg>">
<link rel="manifest" href="data:application/json,{%22name%22:%22Trailblazer%22,%22short_name%22:%22Trailblazer%22,%22start_url%22:%22/%22,%22scope%22:%22/%22,%22display%22:%22standalone%22,%22theme_color%22:%22%23FF4B12%22,%22background_color%22:%22%23F3F4F6%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23FF4B12' width='192' height='192'/><path d='M48 96l48-36 48 36' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='96' cy='84' r='6' fill='%23fff'/></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22},{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect fill='%23FF4B12' width='512' height='512'/><path d='d='M128 256l128-96 128 96' stroke='%23fff' stroke-width='18' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='256' cy='224' r='16' fill='%23fff'/></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}]}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#FFF;--ink:#0E1116;--muted:#6E7681;--faint:#9AA1AC;--line:#E7E9ED;
 --accent:#FF4B12;--sh:0 1px 2px rgba(14,17,22,.05),0 10px 28px -18px rgba(14,17,22,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#DFE2E7;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);
 display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:412px;height:min(880px,calc(100vh - 48px));background:var(--bg);border-radius:34px;
 overflow:hidden;position:relative;display:flex;flex-direction:column;
 box-shadow:0 40px 80px -40px rgba(14,17,22,.5),0 0 0 1px rgba(14,17,22,.08)}
@media (max-width:520px){body{padding:0;align-items:stretch}
 .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}

.topbar{padding:18px 20px 12px;display:flex;align-items:center;gap:12px;flex:none;border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.stuck{border-color:var(--line)}
.today{font-family:"Inter Tight";font-weight:800;font-size:21px;letter-spacing:-.02em}
.datecap{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.mapbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-family:"Inter Tight";font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink);box-shadow:var(--sh)}
.mapbtn.set{background:var(--ink);color:#fff;border-color:var(--ink)}
.streak{margin-left:8px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
 border-radius:999px;padding:7px 12px 7px 10px;font-size:13px;font-weight:700;font-family:"Inter Tight";box-shadow:var(--sh)}
.streak svg{width:15px;height:15px;display:block}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 118px}
.scroll::-webkit-scrollbar{width:0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.pad{padding:16px}
.hdr{display:flex;align-items:center;gap:8px;padding:15px 16px 10px}
.hdr h3{margin:0;font-family:"Inter Tight";font-size:14px;font-weight:700}
.hdr .more{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;font-family:inherit}
.mapwrap{position:relative;background:#E9ECE6;min-height:150px}
.mapwrap svg{display:block;width:100%;height:190px}
.addmap{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.95);border:0;border-radius:9px;padding:8px 12px;font-family:'Inter Tight';font-weight:700;font-size:12px;cursor:pointer;box-shadow:var(--sh);color:var(--ink)}
.maperr{height:190px;display:grid;place-items:center;background:#FFF1EC;color:#8C2C0E;font-size:13px;font-weight:600}
.osmtag{position:absolute;bottom:7px;right:9px;font-size:9.5px;color:#5d6b57;background:rgba(255,255,255,.8);padding:2px 5px;border-radius:4px}
.segname{font-family:"Inter Tight";font-weight:800;font-size:23px;letter-spacing:-.03em;margin:0 0 3px;line-height:1.1}
.segloc{font-size:13px;color:var(--muted);margin:0 0 14px;font-weight:500}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:13px}
.fact{border-right:1px solid var(--line);padding-right:10px}
.fact:last-child{border-right:0}
.fact .k{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.fact .v{font-family:"Inter Tight";font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.fact .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}
.segmented{display:flex;gap:6px;padding:0 16px 14px}
.lvl{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px 8px;cursor:pointer;font-family:inherit;text-align:center;transition:.14s}
.lvl .dot{width:8px;height:8px;border-radius:50%;margin:0 auto 5px;background:var(--c)}
.lvl .nm{font-size:11.5px;font-weight:700;color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.lvl[aria-pressed="true"] .nm{color:var(--ink)}
.lvl:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.target{display:flex;align-items:center;gap:14px;padding:0 16px 16px}
.target .big{font-family:"Inter Tight";font-weight:800;font-size:40px;letter-spacing:-.045em;line-height:.95;font-variant-numeric:tabular-nums}
.target .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.target .sub b{color:var(--ink);font-weight:700}
.row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rank{width:22px;font-family:"Inter Tight";font-weight:700;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:center;flex:none}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-family:"Inter Tight"}
.who{flex:1;min-width:0}
.who .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .m{font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
.tm{font-family:"Inter Tight";font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.row.me{background:color-mix(in srgb,var(--accent) 6%,#fff)}
.row.me .rank{color:var(--accent)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 10px;background:linear-gradient(to top,var(--bg) 62%,rgba(243,244,246,0))}
.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-family:"Inter Tight";font-weight:700;
 font-size:16px;padding:16px;cursor:pointer;box-shadow:0 6px 18px -8px rgba(255,75,18,.9);display:flex;align-items:center;justify-content:center;gap:9px}
.btn svg{width:16px;height:16px}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);box-shadow:none}
.btn.grey{background:#E6E8EC;color:var(--muted);box-shadow:none}
.btn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:0;padding:9px 0 12px;cursor:pointer;color:var(--faint);font-family:inherit}
.tab svg{width:21px;height:21px;display:block;margin:0 auto 3px}
.tab span{font-size:10.5px;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink)}

/* gate / errors */
.gate{position:absolute;inset:0;background:var(--bg);z-index:12;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;text-align:center}
.gate h2{font-family:"Inter Tight";font-weight:800;font-size:25px;letter-spacing:-.03em;margin:0 0 9px;line-height:1.15}
.gate p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.gate code{background:#E6E8EC;padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
.gate .btn{margin-bottom:8px}
.gate .link{background:none;border:0;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:#FFF1EC;border:1px solid #FFD9CB;color:#8C2C0E;border-radius:12px;padding:12px 14px;font-size:12.5px;
 text-align:left;line-height:1.45;margin-bottom:16px;word-break:break-word}

/* recorder */
.rec{position:absolute;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.rec.on{transform:translateY(0)}
.recTop{padding:16px 18px 12px;display:flex;align-items:center;gap:11px;flex:none}
.recTop .x{background:var(--card);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:15px;padding:0;font-family:inherit;flex:none}
.recTop .t{font-family:"Inter Tight";font-weight:700;font-size:15px;min-width:0}
.recTop .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;font-family:Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recMap{flex:1;margin:0 16px;background:#E9ECE6;border-radius:18px;overflow:hidden;position:relative;min-height:130px}
.recMap svg{position:absolute;inset:0;width:100%;height:100%}
.gpspill{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}
.gpspill i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:block}
.gpspill.live i{background:var(--accent);animation:pulse 1.4s infinite}
.gpspill.bad i{background:#D92D20}
@keyframes pulse{50%{opacity:.25}}
.status{margin:12px 16px 0;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh);font-size:13px;font-weight:500;line-height:1.35}
.status .badge{margin-left:auto;font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--bg);color:var(--muted);white-space:nowrap;flex:none}
.status.armed .badge{background:#FFF1EC;color:#B93815}
.status.good .badge{background:#E7F8EF;color:#067647}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);margin:12px 16px 0;border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.metric{background:var(--card);padding:12px 8px 13px;text-align:center}
.metric .k{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-family:"Inter Tight";font-weight:800;font-size:20px;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .v small{font-size:11px;color:var(--muted)}
.bigclock{text-align:center;padding:14px 0 2px}
.bigclock .v{font-family:"Inter Tight";font-weight:800;font-size:54px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.bigclock .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.recDock{padding:10px 16px calc(12px + env(safe-area-inset-bottom));flex:none}

.resultTop{text-align:center;padding:20px 16px 16px}
.rankBig{font-family:"Inter Tight";font-weight:800;font-size:52px;letter-spacing:-.05em;line-height:1}
.rankBig sup{font-size:22px;top:-.5em;position:relative}
.rankSub{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:4px}
.deltaPill{display:inline-block;margin-top:12px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;font-family:"Inter Tight"}
.deltaPill.good{background:#E7F8EF;color:#067647}
.deltaPill.bad{background:#FFF1EC;color:#B93815}
.hist{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hbar{width:4px;border-radius:2px;background:var(--c);flex:none;height:34px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line)}
.stat{background:var(--card);padding:15px 12px}
.stat .k{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:"Inter Tight";font-weight:800;font-size:24px;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{padding:30px 22px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5}
.empty b{display:block;font-family:"Inter Tight";font-size:16px;color:var(--ink);margin-bottom:5px}
.hide{display:none!important}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:18px 18px 0 0;padding:24px 20px;
 max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 16px;font-family:"Inter Tight";font-weight:700;font-size:18px}
.sheet p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.sheet input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:15px;margin-bottom:12px}
.sheet input:focus{outline:2px solid var(--ink);outline-offset:0}
.sheet button{margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="phone">
  <div class="topbar" id="topbar">
    <div><div class="today" id="viewTitle">Today</div><div class="datecap" id="dateCap">—</div></div>
    <div class="streak">
      <svg viewBox="0 0 24 24"><path d="M12 3s5 4.2 5 9a5 5 0 1 1-10 0c0-1.8.8-3.2 1.6-4.2.3 1 .9 1.9 1.8 2.2C10 8.2 12 6 12 3Z" fill="#FF4B12"/></svg>
      <span id="streakN">0</span>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div id="view-today">
      <div class="card">
        <div class="mapwrap" id="mapwrap"></div>
        <div class="pad">
          <h2 class="segname" id="segName">—</h2>
          <p class="segloc" id="segLoc">—</p>
          <div class="facts">
            <div class="fact"><div class="k">Length</div><div class="v" id="fDist">—</div></div>
            <div class="fact"><div class="k">Surface</div><div class="v" id="fSurf">—</div></div>
            <div class="fact"><div class="k">Climb</div><div class="v" id="fClimb">—</div></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="hdr"><h3>Your level</h3><button class="more" id="lvlHelp">How levels work</button></div>
        <div class="segmented" id="levels"></div>
        <div class="target" id="targetBox">
          <div class="big" id="tTime">—</div>
          <div class="sub" id="tPace">—</div>
        </div>
      </div>

      <div class="card hide" id="resultCard">
        <div class="resultTop">
          <div class="rankBig" id="rRank">—</div>
          <div class="rankSub" id="rSub">—</div>
          <div class="deltaPill" id="rDelta">—</div>
        </div>
      </div>

      <div class="card">
        <div class="hdr"><h3 id="boardTitle">Leaderboard</h3><button class="more" id="refreshBoard">Refresh</button></div>
        <div id="boardPreview"><div class="empty">Loading times…</div></div>
      </div>
    </div>

    <div id="view-board" class="hide">
      <div class="card"><div class="hdr"><h3>Filter by level</h3></div><div class="segmented" id="levels2"></div></div>
      <div class="card" id="boardFull"></div>
    </div>

    <div id="view-you" class="hide">
      <div class="card"><div class="stats">
        <div class="stat"><div class="k">Streak</div><div class="v" id="sStreak">0</div></div>
        <div class="stat"><div class="k">Segments</div><div class="v" id="sDone">0</div></div>
        <div class="stat"><div class="k">Total km</div><div class="v" id="sKm">0</div></div>
      </div></div>
      <div class="card"><div class="hdr"><h3>Your runs</h3><button class="more" id="editName">Change name</button></div><div id="histList"></div></div>
    </div>
  </div>

  <div class="dock" id="dock">
    <button class="btn" id="cta"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg><span id="ctaLbl">Record run</span></button>
  </div>

  <div class="tabs">
    <button class="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9l8-5 8 5v10a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z"/></svg><span>Today</span></button>
    <button class="tab" data-v="board" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4v-7H4zM10 20h4V4h-4zM16 20h4v-11h-4z"/></svg><span>Board</span></button>
    <button class="tab" data-v="you" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20c1.3-3.7 4.1-5.5 7.5-5.5s6.2 1.8 7.5 5.5"/></svg><span>You</span></button>
  </div>

  <!-- recorder -->
  <div class="rec" id="rec">
    <div class="recTop">
      <button class="x" id="recClose" aria-label="Close">✕</button>
      <div class="t"><span id="recName">—</span><small id="recSub">—</small></div>
    </div>
    <div class="recMap" id="recMap">
      <svg id="recSvg" viewBox="0 0 340 260" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="gpspill" id="gpsPill"><i></i><span>GPS off</span></div>
    </div>
    <div class="status" id="statusBox">
      <div id="statusTxt">Start recording, then run through the start of the segment.</div>
      <div class="badge" id="statusBadge">Not started</div>
    </div>
    <div class="bigclock"><div class="v" id="recClock">0:00</div><div class="k" id="clockLbl">Segment time</div></div>
    <div class="metrics">
      <div class="metric"><div class="k">Recorded</div><div class="v" id="mDist">0<small>m</small></div></div>
      <div class="metric"><div class="k">Pace</div><div class="v" id="mPace">—</div></div>
      <div class="metric"><div class="k" id="mToK">To start</div><div class="v" id="mTo">—</div></div>
    </div>
    <div class="recDock"><button class="btn" id="recBtn"><span id="recBtnLbl">Start</span></button></div>
  </div>

  <!-- boot gate -->
  <div class="gate" id="gate">
    <div id="gateBody"></div>
  </div>

  <!-- sheet (bottom panel for modals) -->
  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div id="sheetBody"></div>
  </div>
</div>

<script>
/* =========================================================================
   Trailblazer
   - Real authentication via Supabase Auth (Apple, Google, Email)

function getPosition(opts){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({code:-1,message:"This browser has no Geolocation API."});
    navigator.geolocation.getCurrentPosition(p=>res(p),e=>rej(e),opts);
  });
}

  loading("Getting your location…");
  try{
    const p=await getPosition({enableHighAccuracy:true,timeout:15000,maximumAge:60000});
    return [p.coords.latitude,p.coords.longitude];
  }catch(e){
    const why={1:"You denied location access, or the page isn't allowed to use it.",
                2:"Your device couldn't get a position fix.",
                3:"The location request timed out."}[e.code]||"Geolocation isn't available here.";
    fail("Location needed",
      `${esc(why)}<br><br><b>Reported error:</b> ${esc(e.message||"none")}<br><br>
       This app finds today's segment from the roads and paths around you, so it can't continue without a position.
       If you're viewing this inside a preview frame, download the file and open it over <code>https</code> or <code>localhost</code>.`,
      "Try again",start);
    throw e;
  }
}

/* ---------------- 2. real segments from OpenStreetMap ---------------- */
const OVERPASS=["https://overpass-api.de/api/interpreter",
                "https://overpass.kumi.systems/api/interpreter",
                "https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
function query(lat,lng,radius){
  return `[out:json][timeout:30];
way["highway"~"^(footway|path|cycleway|pedestrian|track|residential|living_street|unclassified|tertiary|secondary)$"]["name"]["foot"!="no"]["access"!="private"](around:${radius},${lat},${lng});
out geom;`;
}
function wayLength(g){let d=0;for(let i=1;i<g.length;i++)d+=hav([g[i-1].lat,g[i-1].lon],[g[i].lat,g[i].lon]);return d}

const TIMEOUT_MS=18000;
function fetchTimeout(url,opts,ms){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,Object.assign({},opts,{signal:c.signal})).finally(()=>clearTimeout(t));
}
async function fetchSegments(lat,lng,radius){
  let lastErr=null;
  for(let i=0;i<OVERPASS.length;i++){
    const url=OVERPASS[i], host=new URL(url).host;
    loading(`Searching OpenStreetMap within ${radius} m\n(server ${i+1} of ${OVERPASS.length}: ${host})`);
    const t0=Date.now();
    try{
      const r=await fetchTimeout(url,{method:"POST",
        body:"data="+encodeURIComponent(query(lat,lng,radius)),
        headers:{"Content-Type":"application/x-www-form-urlencoded"}},TIMEOUT_MS);
      if(!r.ok)throw new Error("HTTP "+r.status+" from "+host);
      loading(`Reading the map data back (${((Date.now()-t0)/1000).toFixed(0)}s)…`);
      const j=await r.json();
      if(!j.elements)throw new Error("Unexpected response from "+host);
      return {elements:j.elements,source:host};
    }catch(e){
      lastErr=(e&&e.name==="AbortError")
        ? new Error(host+" did not answer within "+(TIMEOUT_MS/1000)+"s")
        : new Error(host+": "+(e.message||e));
    }
  }
  throw lastErr||new Error("Every OpenStreetMap server failed");
}
function buildCandidates(elements){
  const seen=new Set(), out=[];
  for(const w of elements){
    if(!w.geometry||w.geometry.length<2||!w.tags||!w.tags.name)continue;
    const len=wayLength(w.geometry);
    if(len<MIN_LEN||len>MAX_LEN)continue;
    const k=w.tags.name+"|"+Math.round(len/25);
    if(seen.has(k))continue;
    seen.add(k);
    out.push({id:w.id,name:w.tags.name,
      surface:w.tags.surface||w.tags.highway.replace(/_/g," "),
      highway:w.tags.highway,
      len:Math.round(len),
      geom:w.geometry.map(p=>[p.lat,p.lon])});
  }
  return out.sort((a,b)=>a.id-b.id);
}

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pickToday(cands,cell){

/* ---------------- 4. real elevation (Open Topo Data, no account needed) ---
   SRTM 30 m. Fetched once per segment and cached in shared storage, so the
   whole world costs one request per segment, not one per user.            */
async function loadElevation(){

  const step=Math.max(1,Math.ceil(SEG.geom.length/99));
  const pts=SEG.geom.filter((_,i)=>i%step===0);
  if(pts[pts.length-1]!==SEG.geom[SEG.geom.length-1])pts.push(SEG.geom[SEG.geom.length-1]);
  const locs=pts.map(p=>p[0].toFixed(6)+","+p[1].toFixed(6)).join("|");
  try{
    const r=await fetchTimeout("https://api.opentopodata.org/v1/srtm30m?locations="+encodeURIComponent(locs),{},12000);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    if(j.status!=="OK"||!j.results)throw new Error(j.error||"bad response");
    let raw=j.results.map(x=>x.elevation).filter(v=>typeof v==="number");
    if(raw.length<3)throw new Error("no elevation returned");
    /* SRTM is 30 m data on a sub-100 m feature: smooth before differencing,
       otherwise sampling noise shows up as fake climbing. */
    const prof=raw.map((_,i)=>{
      const a=Math.max(0,i-1), b=Math.min(raw.length-1,i+1);
      return (raw[a]+raw[i]+raw[b])/3;
    });
    let up=0,down=0;
    for(let i=1;i<prof.length;i++){const d=prof[i]-prof[i-1];d>0?up+=d:down-=d}
    const e={prof,up:Math.round(up),down:Math.round(down),
             grade:+(((prof[prof.length-1]-prof[0])/SEG.len)*100).toFixed(1),
             src:"SRTM 30 m via opentopodata.org"};
    SEG.ele=e;
  }catch(e){SEG.ele={error:e.message||String(e)}}
}
function eleProfileSvg(){
  if(!SEG.ele||!SEG.ele.prof)return "";
  const p=SEG.ele.prof, W=380, H=44, lo=Math.min(...p), hi=Math.max(...p), r=Math.max(4,hi-lo);
  const x=i=>i/(p.length-1)*W, y=v=>H-4-((v-lo)/r)*(H-12);
  const line=p.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:44px;background:#F7F8F9">
    <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="#FF4B12" opacity=".10"/>
    <path d="${line}" stroke="#FF4B12" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  </svg>`;
}

/* ---------------- 5. Mapbox static map (needs one pasted token) ---------- */
function encodePolyline(pts){
  let out="",lastLat=0,lastLng=0;
  const enc=v=>{v=v<0?~(v<<1):(v<<1);let s="";
    while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5}
    return s+String.fromCharCode(v+63)};
  for(const p of pts){
    const la=Math.round(p[0]*1e5), lo=Math.round(p[1]*1e5);
    out+=enc(la-lastLat)+enc(lo-lastLng);
    lastLat=la;lastLng=lo;
  }
  return out;
}
function staticMapUrl(geom,w,h){
  const tok=me.mbToken||MAPBOX_TOKEN;
  if(!tok)return null;
  const step=Math.max(1,Math.ceil(geom.length/90));
  const thin=geom.filter((_,i)=>i%step===0);
  if(thin[thin.length-1]!==geom[geom.length-1])thin.push(geom[geom.length-1]);
  const path="path-5+ff4b12-0.95("+encodeURIComponent(encodePolyline(thin))+")";
  const a=geom[0], b=geom[geom.length-1];
  const pins=`pin-s+ffffff(${a[1].toFixed(5)},${a[0].toFixed(5)}),pin-s+0e1116(${b[1].toFixed(5)},${b[0].toFixed(5)})`;
  return `https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/static/${path},${pins}/auto/${w}x${h}@2x`
       + `?padding=30&access_token=${encodeURIComponent(tok)}`;
}

/* ---------------- drawing real geometry ---------------- */
function project(pts,W,H,pad){
  const cLat=(Math.min(...pts.map(p=>p[0]))+Math.max(...pts.map(p=>p[0])))/2, kx=Math.cos(rad(cLat));
  const xs=pts.map(p=>p[1]*kx), ys=pts.map(p=>-p[0]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=(x1-x0)||1e-9, sy=(y1-y0)||1e-9;
  const k=Math.min((W-pad*2)/sx,(H-pad*2)/sy);
  return p=>[p[1]*kx*k+(W-sx*k)/2-x0*k, -p[0]*k+(H-sy*k)/2-y0*k];
}
const pathOf=(pts,f)=>pts.map((p,i)=>(i?"L":"M")+f(p).map(v=>v.toFixed(1)).join(" ")).join(" ");

function drawPreview(){
  const W=380,H=190;

  }else{
    const f=project(SEG.geom,W,H,26),d=pathOf(SEG.geom,f);
    const a=f(SEG.geom[0]),b=f(SEG.geom[SEG.geom.length-1]);

      <path d="${d}" stroke="#FF4B12" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="${b[0]}" cy="${b[1]}" r="8" fill="#0E1116" stroke="#fff" stroke-width="3"/>
    </svg>`;
  }

function streak(){
  const days=[...new Set(me.history.map(h=>h.day))].sort((a,b)=>b-a);
  let s=0,cur=dayIdx;
  if(days[0]!==dayIdx&&days[0]!==dayIdx-1)return 0;
  cur=days[0];
  for(const d of days){if(d===cur){s++;cur--}else break}
  return s;
}
function renderYou(){

  $('sKm').textContent=(me.history.reduce((a,h)=>a+h.d,0)/1000).toFixed(1);
  const h=$('histList');h.innerHTML='';
  if(!me.history.length){h.innerHTML=`<div class="empty"><b>Nothing recorded yet</b>Your runs appear here once you've timed a segment.</div>`;return}
  me.history.slice().reverse().forEach(x=>{
    const d=document.createElement('div');d.className='hist';
    d.style.setProperty('--c',LEVELS[x.lvl].hex);
    d.innerHTML=`<div class="hbar"></div><div class="who"><div class="n">${esc(x.name)}</div>
      <div class="m">${x.d} m · ${new Date(x.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${paceStr(x.t,x.d)}</div></div>
      <div class="tm">${mmss(x.t)}</div>`;
    h.appendChild(d);
  });
  const signOutBtn=document.createElement('button');
  signOutBtn.className='btn dark';
  signOutBtn.style.marginTop='16px';
  signOutBtn.textContent='Sign out';
  signOutBtn.onclick=signOut;
  h.parentElement.appendChild(signOutBtn);
}

/* ---------------- recorder: real GPS only ---------------- */
let rec=blank();
function blank(){return{on:false,phase:'idle',trace:[],dist:0,segT0:0,segTime:null,watch:null,tick:null,last:null,best:99,reversed:false}}
function gpsPill(cls,txt){const p=$('gpsPill');p.className='gpspill'+(cls?' '+cls:'');p.querySelector('span').textContent=txt}
function setStatus(t,b,c){$('statusTxt').innerHTML=t;$('statusBadge').textContent=b;$('statusBox').className='status'+(c?' '+c:'')}

function perpendicularAt(pt,bearing){
  const perpBearing=bearing+Math.PI/2;
  const d=30;
  return [{lat:pt[0]+Math.cos(perpBearing)*d/RE/rad(1),lon:pt[1]+Math.sin(perpBearing)*d/RE/rad(1)},
          {lat:pt[0]-Math.cos(perpBearing)*d/RE/rad(1),lon:pt[1]-Math.sin(perpBearing)*d/RE/rad(1)}];
}
function segmentBearing(p1,p2){
  const dLa=rad(p2[0]-p1[0]), dLo=rad(p2[1]-p1[1]);
  return Math.atan2(Math.sin(dLo)*Math.cos(rad(p2[0])),Math.cos(rad(p1[0]))*Math.sin(rad(p2[0]))-Math.sin(rad(p1[0]))*Math.cos(rad(p2[0]))*Math.cos(dLo));
}
function lineSegmentIntersection(p1,p2,l1,l2){
  const x1=p1[1],y1=p1[0],x2=p2[1],y2=p2[0],x3=l1[1],y3=l1[0],x4=l2[1],y4=l2[0];
  const denom=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(denom)<1e-10)return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/denom;
  const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/denom;
  if(t>=0&&t<=1&&u>=-0.1&&u<=1.1)return [p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])];
  return null;
}
function interpolateTime(p1,p2,t1,t2,crossing){
  const d_total=hav(p1,p2);
  if(d_total<1)return t2;
  const d_to_cross=hav(p1,crossing);
  return t1+(t2-t1)*(d_to_cross/d_total);
}

$('cta').onclick=()=>{
  rec=blank();rec.on=true;
  $('recName').textContent=SEG.name;
  $('recSub').textContent=`${SEG.len} m · target ${mmss(targetFor(me.level))}`;
  $('recBtnLbl').textContent='Start';$('recBtn').className='btn';
  setStatus('Start recording, then run through the start of the segment.','Not started','');
  $('recClock').textContent='0:00';$('clockLbl').textContent='Segment time';
  $('mDist').innerHTML='0<small>m</small>';$('mPace').textContent='—';
  $('mToK').textContent='To start';$('mTo').textContent='—';
  gpsPill('','GPS off');drawRec();
  $('rec').classList.add('on');
};
$('recClose').onclick=closeRec;
function closeRec(){
  $('rec').classList.remove('on');rec.on=false;
  if(rec.watch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(rec.watch);
  clearInterval(rec.tick);
}
$('recBtn').onclick=async()=>{
  if(rec.phase==='idle')startRec();
  else if(rec.phase==='done'){
    $('recBtnLbl').textContent='Saving…';$('recBtn').className='btn grey';
    await saveRun();closeRec();
  }else stopRec();
};
function startRec(){
  if(!navigator.geolocation){
    setStatus('This browser has no Geolocation API, so nothing can be timed.','Unavailable','armed');return;
  }
  rec.phase='approach';
  $('recBtnLbl').textContent='Stop';$('recBtn').className='btn dark';
  setStatus('Recording. The clock starts when you cross the start point.','Approaching','armed');
  gpsPill('','Waiting for a fix…');
  rec.tick=setInterval(paintRec,250);
  rec.watch=navigator.geolocation.watchPosition(
    p=>onFix([p.coords.latitude,p.coords.longitude],p.coords.accuracy||99),
    e=>{gpsPill('bad','GPS error');
        setStatus('GPS error: '+esc(e.message||'no position')+'. Nothing is being timed.','No fix','armed')},
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
function onFix(p,acc){
  if(!rec.on||rec.phase==='idle'||rec.phase==='done')return;
  rec.best=Math.min(rec.best,acc);
  if(acc>MAX_ACC){gpsPill('bad','Weak fix ±'+Math.round(acc)+'m — ignoring');return}
  gpsPill('live','GPS ±'+Math.round(acc)+'m');
  if(rec.last)rec.dist+=hav(rec.last,p);
  rec.last=p;
  const now_t=Date.now();
  const lastTrace=rec.trace.length?rec.trace[rec.trace.length-1]:{p:p,t:now_t};
  rec.trace.push({p,t:now_t});

  const A=SEG.geom[0], B=SEG.geom[SEG.geom.length-1];
  const bearing_forward=segmentBearing(SEG.geom[0],SEG.geom[1]);
  const bearing_backward=segmentBearing(B,SEG.geom[SEG.geom.length-2]);
  const [lineA_1,lineA_2]=perpendicularAt(A,bearing_forward);
  const [lineB_1,lineB_2]=perpendicularAt(B,bearing_backward);

  if(rec.phase==='approach'){
    const distA=hav(p,A), distB=hav(p,B);
    if(distA>30&&distB>30)return;

    if(lastTrace.p!==p){
      const crossA=lineSegmentIntersection(lastTrace.p,p,lineA_1,lineA_2);
      const crossB=lineSegmentIntersection(lastTrace.p,p,lineB_1,lineB_2);

      if(crossB&&!crossA){
        rec.reversed=true;
        rec.phase='onseg';
        rec.segT0=interpolateTime(lastTrace.p,p,lastTrace.t,now_t,crossB)*1000;
        setStatus('On the segment (reversed). Timing now.','Timing','armed');
        $('mToK').textContent='To finish';
        if(navigator.vibrate)navigator.vibrate(60);
      }else if(crossA){
        rec.reversed=false;
        rec.phase='onseg';
        rec.segT0=interpolateTime(lastTrace.p,p,lastTrace.t,now_t,crossA)*1000;
        setStatus('On the segment. Timing now.','Timing','armed');
        $('mToK').textContent='To finish';
        if(navigator.vibrate)navigator.vibrate(60);
      }
    }
  }else if(rec.phase==='onseg'){
    const endPoint=rec.reversed?A:B;
    const endLine=rec.reversed?[lineA_1,lineA_2]:[lineB_1,lineB_2];
    if(hav(p,endPoint)>30)return;

    if(lastTrace.p!==p){
      const crossing=lineSegmentIntersection(lastTrace.p,p,endLine[0],endLine[1]);
      if(crossing){
        rec.phase='done';
        rec.segTime=(interpolateTime(lastTrace.p,p,lastTrace.t,now_t,crossing)-rec.segT0)/1000;
        finishRec();
      }
    }
  }
  paintRec();
}
function stopRec(){
  if(rec.phase==='onseg'){rec.phase='done';rec.segTime=(Date.now()-rec.segT0)/1000;finishRec();return}
  if(rec.watch!=null)navigator.geolocation.clearWatch(rec.watch);
  clearInterval(rec.tick);rec.phase='idle';
  setStatus('Stopped before the start point, so nothing was timed.','Discarded','');
  $('recBtnLbl').textContent='Start';$('recBtn').className='btn';
}
function finishRec(){
  if(rec.watch!=null){navigator.geolocation.clearWatch(rec.watch);rec.watch=null}
  clearInterval(rec.tick);
  const faster=BOARD.filter(e=>e.t<rec.segTime).length;
  setStatus(`Segment complete. That would be ${ord(faster+1)} on today's board.`,'Complete','good');
  $('clockLbl').textContent='Final segment time';
  $('mToK').textContent='To finish';$('mTo').textContent='0m';
  $('recBtnLbl').textContent='Post to leaderboard';$('recBtn').className='btn';
  paintRec();
  if(navigator.vibrate)navigator.vibrate([40,60,40]);
}
async function saveRun(){
  if(rec.segTime==null)return;
  if(!me.name){
    me.name="Runner";
  }
  me.history.push({day:dayIdx,at:Date.now(),name:SEG.name,d:SEG.len,t:rec.segTime,lvl:me.level});
  await saveMe();
  try{
    await postTime(rec.segTime);
  }catch(e){
    setStatus("Saved on this phone, but the leaderboard rejected it: "+esc(e.message),"Not posted","armed");
    $('recBtnLbl').textContent="Try posting again";$('recBtn').className='btn';
    renderAll();return;
  }
  renderAll();
  document.querySelector('.tab[data-v="today"]').click();
}
function paintRec(){
  if(rec.phase==='onseg')$('recClock').textContent=mmss((Date.now()-rec.segT0)/1000);
  else if(rec.phase==='done')$('recClock').textContent=mmss(rec.segTime);
  $('mDist').innerHTML=rec.dist<1000?Math.round(rec.dist)+'<small>m</small>':(rec.dist/1000).toFixed(2)+'<small>km</small>';
  const rc=rec.trace.slice(-12);
  if(rc.length>3){
    let d=0;for(let i=1;i<rc.length;i++)d+=hav(rc[i-1].p,rc[i].p);
    const dt=(rc[rc.length-1].t-rc[0].t)/1000;
    $('mPace').textContent=(d>5&&dt>0)?mmss(dt/(d/1000)):'—';
  }
  if(rec.last&&rec.phase!=='done'){
    const tgt=rec.phase==='approach'?SEG.geom[0]:SEG.geom[SEG.geom.length-1];
    $('mTo').textContent=Math.round(hav(rec.last,tgt))+'m';
  }
  drawRec();
}
function drawRec(){
  if(!SEG)return;
  const W=340,H=260;
  const all=SEG.geom.concat(rec.trace.map(t=>t.p));
  const f=project(all,W,H,26), d=pathOf(SEG.geom,f);
  const a=f(SEG.geom[0]), b=f(SEG.geom[SEG.geom.length-1]);
  const tr=rec.trace.length>1?`<path d="${pathOf(rec.trace.map(t=>t.p),f)}" stroke="#2E90FA" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`:'';
  let m='';
  if(rec.last){const q=f(rec.last);
    m=`<circle cx="${q[0]}" cy="${q[1]}" r="12" fill="#2E90FA" opacity=".18"/><circle cx="${q[0]}" cy="${q[1]}" r="6" fill="#2E90FA" stroke="#fff" stroke-width="2.5"/>`}
  $('recSvg').innerHTML=`<rect width="${W}" height="${H}" fill="#E9ECE6"/>
    <path d="${d}" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" stroke="#FF4B12" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${rec.phase==='onseg'?1:.5}"/>
    ${tr}<circle cx="${a[0]}" cy="${a[1]}" r="8" fill="#fff" stroke="#FF4B12" stroke-width="4"/>
    <circle cx="${b[0]}" cy="${b[1]}" r="9" fill="#0E1116" stroke="#fff" stroke-width="3"/>${m}`;
}

/* ---------------- profile persistence ---------------- */
async function saveMe(){await sSet("ds.me",JSON.stringify(me),false)}
async function loadMe(){
  if(currentUser){
    me.id=currentUser.uid;
    me.name=currentUser.displayName||currentUser.email?.split('@')[0]||'Runner';
  }
  const v=await sGet("ds.me",false);
  if(v){try{const d=JSON.parse(v);me={...me,...d}}catch(e){}}
  await saveMe();
  paintMapBtn();
}

/* ---------------- boot ---------------- */
let RADIUS=700;
async function start(){
  loading("Starting…");
  await initAuth();

  if(!currentUser){
    showSignIn();
    return;
  }

  await loadMe();
  loading("Finding your location…");
  let pos;
  try{pos=await askLocation()}catch(e){return}

  loading("Finding named paths and roads around you…");
  let res;
  try{res=await fetchSegments(pos[0],pos[1],RADIUS)}
  catch(e){
    fail("Couldn't reach OpenStreetMap",
      `The Overpass API request failed on every mirror.<br><br><b>Last error:</b> ${esc(e.message||e)}<br><br>
       Segments come from live OSM data, so there is nothing to show until this request succeeds.
       A preview frame usually blocks outbound requests — open the downloaded file directly, or serve it, and it will work.`,
      "Retry",start);
    return;
  }
  const cands=buildCandidates(res.elements);
  if(!cands.length){
    RADIUS=Math.min(RADIUS*2,5000);
    fail("No usable segments nearby",
      `OpenStreetMap returned ${res.elements.length} named ways within ${RADIUS/2} m of you, but none were between
       ${MIN_LEN} m and ${MAX_LEN} m long and open to pedestrians.`,
      `Search ${RADIUS} m instead`,start);
    return;
  }
  SEG=pickToday(cands,cellOf(pos[0],pos[1]));
  SEG.area=`${cands.length} candidates within ${RADIUS} m · via ${res.source}`;

  loading("Reading the elevation profile…");
  await loadElevation();

  loading("Loading today's board…");
  await loadBoard();
  renderAll();drawPreview();gateOff();
}

start();
</script>

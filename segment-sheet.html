<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Trailblazer — Segment</title>
  <meta name="theme-color" content="#FF4B12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lib/mobile.css">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
  <style>
    :root {
      --bg: #F3F4F6;
      --card: #FFF;
      --ink: #0E1116;
      --muted: #6E7681;
      --faint: #9AA1AC;
      --line: #E7E9ED;
      --accent: #FF4B12;
      --sh: 0 1px 2px rgba(14,17,22,.05), 0 10px 28px -18px rgba(14,17,22,.35);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    #map.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-radius: 20px 20px 0 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      max-height: 70dvh;
      box-shadow: 0 -10px 30px -10px rgba(14,17,22,.2);
      height: 40dvh;
    }
    .sheet.expanded {
      height: 70dvh;
    }
    .sheet-handle {
      padding: 8px 0 4px;
      text-align: center;
      flex: 0 0 auto;
      cursor: grab;
    }
    .sheet-handle:active {
      cursor: grabbing;
    }
    .handle-bar {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 0 auto;
    }
    .sheet-body {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px;
    }
    .sheet-body::-webkit-scrollbar {
      width: 6px;
    }
    .sheet-body::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }
    .sheet-action {
      flex: 0 0 auto;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      min-height: 44px;
      display: flex;
      gap: 8px;
    }
    .seg-name {
      font-family: "Inter Tight";
      font-weight: 800;
      font-size: 22px;
      margin: 12px 0 3px;
      line-height: 1.1;
    }
    .seg-location {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      margin: 12px 0;
    }
    .fact {
      text-align: center;
    }
    .fact-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--faint);
      margin-bottom: 3px;
    }
    .fact-value {
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 14px;
    }
    .elevation {
      height: 100px;
      background: var(--bg);
      border-radius: 10px;
      margin: 12px 0;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .target-time {
      padding: 12px;
      background: var(--bg);
      border-radius: 10px;
      margin: 12px 0;
      font-size: 13px;
    }
    .target-time .label {
      color: var(--muted);
      margin-bottom: 4px;
    }
    .target-time .time {
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 18px;
    }
    .level-filter {
      display: flex;
      gap: 6px;
      margin: 12px 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .level-btn {
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }
    .level-btn[aria-pressed="true"] {
      background: var(--ink);
      color: var(--card);
      border-color: var(--ink);
    }
    .board {
      margin: 12px 0;
    }
    .board-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .board-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .board-row:hover {
      background: var(--bg);
    }
    .board-row.me {
      background: color-mix(in srgb, var(--accent) 8%, #fff);
    }
    .rank {
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 12px;
      color: var(--faint);
      width: 24px;
      text-align: center;
      flex: none;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--card);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      flex: none;
    }
    .runner-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }
    .runner-time {
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 13px;
      flex: none;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-family: "Inter Tight";
      font-weight: 700;
      font-size: 16px;
      padding: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px -8px rgba(255,75,18,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .empty-state {
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .error-box {
      background: #FFF1EC;
      border: 1px solid #FFD9CB;
      color: #8C2C0E;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div id="map"></div>

    <div class="sheet" id="sheet">
      <div class="sheet-handle" id="sheetHandle">
        <div class="handle-bar"></div>
      </div>

      <div class="sheet-body" id="sheetBody">
        <!-- Dynamic content here -->
      </div>

      <div class="sheet-action" id="sheetAction">
        <button class="btn" id="runBtn" style="flex: 1; margin: 0;">Run this</button>
        <button id="reportBtn" style="flex: 0 0 auto; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 16px;">⚠</button>
      </div>
    </div>
  </div>

  <script src="/lib/tap.js"></script>
  <script src="/lib/errors.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
  <script src="lib/constants.js"></script>
  <script src="lib/utils.js"></script>
  <script src="lib/api.js"></script>
  <script src="lib/auth.js"></script>
  <script>
    // Map initialization
    let map;
    function initMap() {
      mapboxgl.accessToken = window.AppConstants.MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        zoom: 14,
        center: [0, 51.5]
      });

      function resizeMap() {
        if (map) {
          setTimeout(() => map.resize(), 100);
        }
      }

      function loadSegmentsInView() {
        // Placeholder - segments load from detail
      }

      map.on('load', () => {
        resizeMap();
        loadSegmentsInView();
      });
      map.on('moveend', () => loadSegmentsInView());
      setTimeout(() => {
        resizeMap();
        loadSegmentsInView();
      }, 2500);
    }

    // Segment Sheet Logic
    let userId;
    let hasReportedSegment = false;

    // Get current user session
    window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        window.location.href = '/section-2-auth.html';
      } else {
        userId = session.user.id;
        checkUserReports();
        initMap();
        loadSegment();
      }
    });

    async function ensureUserId() {
      if (!userId) {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = '/section-2-auth.html';
        } else {
          userId = session.user.id;
        }
      }
    }

    // Check if user has already reported this segment
    async function checkUserReports() {
      const has = await window.AppAPI.hasUserReportedSegment(segmentId, userId);
      hasReportedSegment = has;
    }

    // Get segment ID from query param
    const urlParams = new URLSearchParams(window.location.search);
    const segmentId = urlParams.get('segment_id');
    if (!segmentId) {
      window.location.href = '/home-map.html';
    }

    let segment, board = [], currentLevel = null;
    const sheet = document.getElementById('sheet');
    const sheetBody = document.getElementById('sheetBody');
    const sheetHandle = document.getElementById('sheetHandle');

    // Toggle expanded/collapsed on handle drag or click
    let isExpanded = false;
    let startY = 0;
    let startHeight = 0;

    sheetHandle.addEventListener('mousedown', (e) => {
      startY = e.clientY;
      startHeight = sheet.offsetHeight;
      document.addEventListener('mousemove', handleDrag);
      document.addEventListener('mouseup', endDrag);
    });

    sheetHandle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      startHeight = sheet.offsetHeight;
      document.addEventListener('touchmove', handleDrag);
      document.addEventListener('touchend', endDrag);
    });

    function handleDrag(e) {
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;
      const diff = startY - currentY;
      const newHeight = Math.max(40, Math.min(70, (startHeight + diff) / window.innerHeight * 100));
      sheet.style.height = newHeight + 'dvh';
    }

    function endDrag() {
      document.removeEventListener('mousemove', handleDrag);
      document.removeEventListener('mouseup', endDrag);
      document.removeEventListener('touchmove', handleDrag);
      document.removeEventListener('touchend', endDrag);

      const currentHeight = parseInt(sheet.style.height) || 40;
      if (currentHeight > 55) {
        sheet.classList.add('expanded');
        sheet.style.height = '70dvh';
      } else {
        sheet.classList.remove('expanded');
        sheet.style.height = '40dvh';
      }
      if (map) map.resize();
    }

    sheet.addEventListener('click', (e) => {
      if (e.target.closest('.btn, button[id]')) return;
      isExpanded = !isExpanded;
      sheet.classList.toggle('expanded');
      if (isExpanded) {
        sheet.style.height = '70dvh';
      } else {
        sheet.style.height = '40dvh';
      }
      if (map) map.resize();
    });

    // Load segment and board
    async function loadSegment() {
      const { data: segmentData, error: segError } = await window.AppAPI.getSegment(segmentId);
      if (!segError && segmentData) {
        segment = segmentData;
      }

      const { data: boardData, error: boardError } = await window.AppAPI.getSegmentBoardToday(segmentId, currentLevel);
      if (!boardError && boardData) {
        board = boardData;
      }

      renderContent();
    }

    function renderContent() {
      const isEmpty = board.length === 0;

      let html = `
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-top: 12px;">
          <div class="seg-name" style="margin: 0; flex: 1;">${segment?.name || 'Segment'}</div>
          <button id="shareBtn" style="flex: 0 0 auto; margin: 0; padding: 8px 12px; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;">Share</button>
        </div>
        <div class="seg-location">${segment?.highway || 'Road'}</div>

        <div class="facts">
          <div class="fact">
            <div class="fact-label">Distance</div>
            <div class="fact-value">${segment ? (segment.length_m / 1000).toFixed(1) : '1.2'} km</div>
          </div>
          <div class="fact">
            <div class="fact-label">Climb</div>
            <div class="fact-value">${segment?.climb_m || 0} m</div>
          </div>
          <div class="fact">
            <div class="fact-label">Surface</div>
            <div class="fact-value">${segment?.surface || 'Tarmac'}</div>
          </div>
        </div>

        <div class="elevation">
          Elevation profile
        </div>

        <div class="target-time">
          <div class="label">Your level target</div>
          <div class="time">6:45</div>
        </div>

        <div class="level-filter">
          <button class="level-btn" data-level="1" aria-pressed="false">Level 1</button>
          <button class="level-btn" data-level="2" aria-pressed="false">Level 2</button>
          <button class="level-btn" data-level="3" aria-pressed="false">Level 3</button>
        </div>

        <div class="board">
          <div class="board-title">Today's Board</div>
      `;

      if (isEmpty) {
        html += `<div class="empty-state">Nobody has run this today. Be first.</div>`;
      } else {
        board.forEach((run, idx) => {
          const isYou = run.user_id === userId;
          html += `
            <div class="board-row ${isYou ? 'me' : ''}">
              <div class="rank">${idx + 1}</div>
              <div class="avatar">${window.AppUtils.getInitials(run.profiles?.display_name || 'Runner')}</div>
              <div class="runner-name">${run.profiles?.display_name || 'Runner'}</div>
              <div class="runner-time">${window.AppUtils.formatTime(run.seconds)}</div>
            </div>
          `;
        });
      }

      html += `</div>`;

      sheetBody.innerHTML = html;

      // Event listeners
      document.getElementById('runBtn').removeEventListener('click', handleRunClick);
      document.getElementById('runBtn').addEventListener('click', handleRunClick);

      const shareBtn = document.getElementById('shareBtn');
      if (shareBtn) {
        shareBtn.removeEventListener('click', handleShareClick);
        shareBtn.addEventListener('click', handleShareClick);
      }

      document.getElementById('reportBtn').removeEventListener('click', handleReportClick);
      document.getElementById('reportBtn').addEventListener('click', handleReportClick);

      document.querySelectorAll('.level-btn').forEach(btn => {
        btn.removeEventListener('click', handleLevelChange);
        btn.addEventListener('click', handleLevelChange);
      });
    }

    function handleRunClick() {
      window.location.href = '/recording.html?segment_id=' + segmentId;
    }

    function handleShareClick(e) {
      e.stopPropagation();
      handleShare();
    }

    function handleReportClick(e) {
      e.stopPropagation();
      if (hasReportedSegment) {
        alert('You have already reported this segment.');
      } else {
        alert('Report feature coming soon');
      }
    }

    async function handleLevelChange(e) {
      const btn = e.target;
      document.querySelectorAll('.level-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      currentLevel = parseInt(btn.dataset.level);

      await ensureUserId();
      const { data: boardData } = await window.AppAPI.getSegmentBoardToday(segmentId, currentLevel);
      if (boardData) {
        board = boardData;
        renderContent();
      }
    }

    async function handleShare() {
      if (!segment) return;

      try {
        const shareText = `I ran ${segment.name}!`;
        const shareLink = `${window.location.origin}/public-segment.html?segment_id=${segmentId}`;

        if (navigator.share) {
          await navigator.share({
            title: 'Trailblazer',
            text: shareText,
            url: shareLink
          });
        } else {
          await navigator.clipboard.writeText(shareLink);
          alert('Link copied to clipboard!');
        }
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('Share failed:', error);
        }
      }
    }
  </script>
</body>
</html>
